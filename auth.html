<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #error-message {
            color: #d9534f;
            background-color: #f2dede;
            border: 1px solid #ebccd1;
            padding: 10px;
            margin: 10px auto;
            max-width: 400px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-family: sans-serif;
        }
        /* Style for the Role Tabs inside the box */
        .role-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 5px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #fff;
            border-radius: 4px;
            width: 50%;
            transition: background 0.3s;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <header style="text-align: center; margin: 20px 0; color: #007bff; font-family: sans-serif; font-size: 24px; font-weight: bold;">
        Complaint Management System
    </header>
    
    <div class="auth-container">
        <div id="error-message"></div>

        <div class="form-box" style="max-width: 400px; margin: 20px auto; padding: 30px; background: #5f9ea0; border-radius: 8px; font-family: sans-serif; color: black;">
            
            <div class="role-tabs">
                <button type="button" id="customerTab" class="tab-btn active" onclick="setRole('customer')">Customer</button>
                <button type="button" id="adminTab" class="tab-btn" onclick="setRole('admin')">Admin</button>
            </div>

            <h2 id="login-title" style="text-align: center; margin-top: 0; font-size: 26px;">Customer Login</h2>
            <br>
            <form id="loginForm">
                <label style="display:block; font-weight:bold; margin-bottom:5px;">Email</label>
                <input type="email" id="loginEmail" placeholder="Enter email" style="width:100%; padding:10px; box-sizing:border-box; border-radius:4px; border:1px solid #ccc; margin-bottom:15px;" required>

                <label style="display:block; font-weight:bold; margin-bottom:5px;">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" style="width:100%; padding:10px; box-sizing:border-box; border-radius:4px; border:1px solid #ccc; margin-bottom:20px;" required>

                <button type="submit" style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:4px; font-size:16px; font-weight:bold; cursor:pointer;">Login</button>
            </form>
        </div>
    </div>

    <script>
    // Default system tracking role status variable
    let currentRole = 'customer'; 

    // Function to handle switching tabs inside the container UI
    function setRole(role) {
        currentRole = role;
        
        const customerTab = document.getElementById('customerTab');
        const adminTab = document.getElementById('adminTab');
        const titleText = document.getElementById('login-title');

        if (role === 'admin') {
            adminTab.classList.add('active');
            customerTab.classList.remove('active');
            titleText.innerText = "Admin Login";
        } else {
            customerTab.classList.add('active');
            adminTab.classList.remove('active');
            titleText.innerText = "Customer Login";
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const typedEmail = document.getElementById('loginEmail').value.trim().toLowerCase();
        const typedPassword = document.getElementById('loginPassword').value;
        const errorDisplay = document.getElementById('error-message');

        errorDisplay.style.display = 'none';
        errorDisplay.innerText = '';

        //  users list matching database 
        const customerAccounts = [
            { email: "jane@test.com", password: "password123" },
            { email: "customer@test.com", password: "pass" }
        ];

        const adminAccounts = [
            { email: "admin@system.com", password: "admin123" }
        ];

        const activeDatabase = currentRole === 'admin' ? adminAccounts : customerAccounts;
        let accountMatched = activeDatabase.find(user => user.email === typedEmail);

        if (!accountMatched) {
            errorDisplay.innerText = `❌ Account error: Email not found under the selected ${currentRole} list.`;
            errorDisplay.style.display = 'block';
        } else if (accountMatched.password !== typedPassword) {
            errorDisplay.innerText = "❌ Incorrect password. Please try again.";
            errorDisplay.style.display = 'block';
        } else {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userRole', currentRole);

            alert("Login successful! Redirecting...");
            
            if (currentRole === 'admin') {
                window.location.href = "admin.html";
            } else {
                window.location.href = "Complaint.html";
            }
        }
    });
    </script>
</body>
</html>
